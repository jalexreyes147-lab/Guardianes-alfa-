<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen Alfa: Eco en Ruta</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        #game-container {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        class MainScene extends Phaser.Scene {
            constructor() {
                super('MainScene');
            }

            preload() {
                // No cargamos imágenes externas para evitar errores de archivos faltantes
            }

            create() {
                // Fondo con degradado
                this.add.rectangle(400, 300, 800, 600, 0x0a0a1a);
                
                // Título
                this.add.text(400, 150, 'GEN ALFA: ECO EN RUTA', {
                    fontSize: '48px',
                    fill: '#00ff88',
                    fontStyle: 'bold'
                }).setOrigin(0.5);

                // Instrucciones
                this.add.text(400, 300, 'Usa las FLECHAS para moverte\ny saltar los obstáculos', {
                    fontSize: '24px',
                    fill: '#ffffff',
                    align: 'center'
                }).setOrigin(0.5);

                // Botón de inicio
                const btn = this.add.rectangle(400, 450, 200, 60, 0x00ff88)
                    .setInteractive({ useHandCursor: true });
                
                this.add.text(400, 450, '¡JUGAR!', {
                    fontSize: '28px',
                    fill: '#000000',
                    fontStyle: 'bold'
                }).setOrigin(0.5);

                // Personaje de prueba (un cuadrado verde)
                this.player = this.add.rectangle(100, 550, 40, 40, 0x00ff88);
                this.physics.add.existing(this.player);
                this.player.body.setCollideWorldBounds(true);

                // Plataforma de suelo
                const platforms = this.physics.add.staticGroup();
                const ground = this.add.rectangle(400, 580, 800, 40, 0x333333);
                platforms.add(ground);
                this.physics.add.collider(this.player, platforms);

                // Controles
                this.cursors = this.input.keyboard.createCursorKeys();

                btn.on('pointerdown', () => {
                    btn.setFillStyle(0xffffff);
                    this.add.text(400, 220, 'Iniciando misión...', { fill: '#00ff88' }).setOrigin(0.5);
                });
            }

            update() {
                if (this.cursors.left.isDown) {
                    this.player.body.setVelocityX(-200);
                } else if (this.cursors.right.isDown) {
                    this.player.body.setVelocityX(200);
                } else {
                    this.player.body.setVelocityX(0);
                }

                if (this.cursors.up.isDown && this.player.body.touching.down) {
                    this.player.body.setVelocityY(-400);
                }
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 800 }, debug: false }
            },
            scene: MainScene
        };

        new Phaser.Game(config);
    </script>
</body>
</html>
