<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gen Alpha Eco - Jugable</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #020a06; color: #e0ffe8; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 600px; border: 2px solid #00ff88; border-radius: 15px; box-shadow: 0 0 30px rgba(0,255,136,0.3); }
        .screen { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: rgba(2,10,6,0.9); }
        .active { display: flex; }
        .btn { background: #00ff88; color: #000; padding: 15px 30px; margin: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .btn:hover { background: #fff; transform: scale(1.05); }
        h1 { color: #00ff88; font-size: 40px; text-shadow: 0 0 10px #00ff88; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="main-menu" class="screen active">
        <h1>GEN ALPHA: ECO EN RUTA</h1>
        <p>Selecciona una misión para comenzar</p>
        <button class="btn" onclick="startGame('racer')">Misión: Eco-Racer</button>
        <button class="btn" onclick="startGame('dodge')">Misión: Limpieza Oceánica</button>
    </div>

    <div id="phaser-game" class="screen">
        <div id="phaser-app"></div>
        <button class="btn" style="position:absolute; bottom:20px;" onclick="backToMenu()">VOLVER AL MENÚ</button>
    </div>
</div>

<script>
    let game;

    function startGame(type) {
        // Ocultar menú y mostrar contenedor de juego
        document.getElementById('main-menu').classList.remove('active');
        document.getElementById('phaser-game').classList.add('active');

        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'phaser-app',
            physics: { default: 'arcade', arcade: { gravity: { y: type === 'racer' ? 0 : 800 } } },
            scene: type === 'racer' ? RacerScene : DodgeScene
        };

        if (game) game.destroy(true);
        game = new Phaser.Game(config);
    }

    function backToMenu() {
        if (game) game.destroy(true);
        document.getElementById('phaser-game').classList.remove('active');
        document.getElementById('main-menu').classList.add('active');
    }

    // --- ESCENA 1: ECO-RACER ---
    class RacerScene extends Phaser.Scene {
        create() {
            this.add.text(400, 50, 'ECO-RACER: Esquiva el CO2', { fontSize: '24px', fill: '#0f8' }).setOrigin(0.5);
            this.player = this.add.rectangle(400, 500, 50, 80, 0x00eeff);
            this.physics.add.existing(this.player);
            this.player.body.setCollideWorldBounds(true);
            
            this.obstacles = this.physics.add.group();
            this.time.addEvent({ delay: 1000, callback: () => {
                let obs = this.add.circle(Phaser.Math.Between(50, 750), -50, 20, 0xff3355);
                this.obstacles.add(obs);
                obs.body.setVelocityY(300);
            }, callbackScope: this, loop: true });

            this.physics.add.overlap(this.player, this.obstacles, () => {
                this.scene.restart();
                alert('¡Colisión de CO2! Reintentando...');
            });

            this.cursors = this.input.keyboard.createCursorKeys();
        }
        update() {
            if (this.cursors.left.isDown) this.player.body.setVelocityX(-300);
            else if (this.cursors.right.isDown) this.player.body.setVelocityX(300);
            else this.player.body.setVelocityX(0);
        }
    }

    // --- ESCENA 2: LIMPIEZA OCEÁNICA ---
    class DodgeScene extends Phaser.Scene {
        create() {
            this.add.text(400, 50, 'LIMPIEZA: Recoge el plástico', { fontSize: '24px', fill: '#0f8' }).setOrigin(0.5);
            this.player = this.add.rectangle(100, 450, 40, 40, 0xaaff00);
            this.physics.add.existing(this.player);
            this.player.body.setCollideWorldBounds(true);

            this.platforms = this.physics.add.staticGroup();
            this.platforms.add(this.add.rectangle(400, 580, 800, 40, 0x333333));
            this.physics.add.collider(this.player, this.platforms);

            this.items = this.physics.add.group();
            for(let i=0; i<5; i++) {
                let item = this.add.circle(Phaser.Math.Between(100, 700), 100, 10, 0xffffff);
                this.items.add(item);
                item.body.setBounceY(0.5);
                item.body.setCollideWorldBounds(true);
            }
            this.physics.add.collider(this.items, this.platforms);
            this.physics.add.overlap(this.player, this.items, (p, item) => item.destroy());

            this.cursors = this.input.keyboard.createCursorKeys();
        }
        update() {
            if (this.cursors.left.isDown) this.player.body.setVelocityX(-200);
            else if (this.cursors.right.isDown) this.player.body.setVelocityX(200);
            else this.player.body.setVelocityX(0);
            if (this.cursors.up.isDown && this.player.body.touching.down) this.player.body.setVelocityY(-500);
        }
    }
</script>

</body>
</html>
